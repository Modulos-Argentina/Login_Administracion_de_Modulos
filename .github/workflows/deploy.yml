name: Desplegar ASP.NET a MonsterASP

on:
  # 1. Permite presionar un botón manual en GitHub Actions para desplegar
  workflow_dispatch:

  # 2. Se activa con push a master SOLO SI el commit lleva la palabra [deploy]
  push:
    branches:
      - master

jobs:
  compilar_y_subir:
    # Condición mágica: Solo corre si le diste al botón manual O si el commit dice [deploy]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código de GitHub (Con soporte de submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Preparar .NET Core 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Compilar el proyecto (Publish)
        run: dotnet publish -c Release -o ./publish_output

      # 4. Inyectar configuración de Producción con GitHub Secrets antes del FTP
      - name: 4. Generar appsettings.Production.json desde GitHub Secrets
        shell: bash
        run: |
          cat <<EOF > ./publish_output/appsettings.Production.json
          {
            "ConnectionStrings": {
              "DefaultConnection": "${{ secrets.DB_CONNECTION_STRING }}"
            },
            "Authentication": {
              "Google": {
                "ClientId": "${{ secrets.GOOGLE_CLIENT_ID }}",
                "ClientSecret": "${{ secrets.GOOGLE_CLIENT_SECRET }}"
              }
            },
            "Security": {
              "EnableDemoLogin": true,
              "AllowLegacyPasswords": false
            }
          }
          EOF

      # 5. Apagamos el sitio y esperamos 5 segundos para que Windows suelte la .dll
      - name: 5. Apagar sitio web temporalmente
        run: |
          echo "<html><head><meta charset='utf-8'></head><body><h2>Actualizando... vuelva en 1 minuto.</h2></body></html>" > app_offline.htm
          curl -k -T app_offline.htm -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm" || true
          sleep 5

      # 6. Subir los archivos nuevos al hosting
      - name: 6. Sincronizar archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./publish_output/
          server-dir: /wwwroot/

      # 7. Borramos app_offline.htm para que el servidor vuelva a encender con los cambios
      - name: 7. Encender el sitio web
        if: always()
        run: |
          curl -k -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" -Q "-DELE /wwwroot/app_offline.htm" || true
