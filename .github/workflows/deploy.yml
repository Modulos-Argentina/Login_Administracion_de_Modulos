name: Desplegar ASP.NET a MonsterASP

on:
  push:
    branches:
      - master

jobs:
  compilar_y_subir:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código de GitHub
        uses: actions/checkout@v4

      - name: 2. Preparar .NET Core 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Compilar el proyecto (Publish)
        run: dotnet publish -c Release -o ./publish_output

      # 4. Creamos app_offline.htm para que el servidor libere los .dll
      - name: 4. Detener temporalmente el sitio en el servidor
        run: |
          echo "<html><head><meta charset='utf-8'></head><body><h2>Actualizando sistema... espere unos segundos.</h2></body></html>" > app_offline.htm
          curl -k -T app_offline.htm -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm" || true

      # 5. Sube los archivos nuevos (ahora el .dll ya no está bloqueado)
      - name: 5. Sincronizar archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./publish_output/
          server-dir: /wwwroot/

      # 6. Borramos app_offline.htm para que el servidor vuelva a encender con los cambios
      - name: 6. Reactivar el sitio web
        if: always()
        run: |
          curl -k -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" -Q "-DELE /wwwroot/app_offline.htm" || true
