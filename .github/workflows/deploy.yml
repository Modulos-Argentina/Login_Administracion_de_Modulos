name: Desplegar ASP.NET a MonsterASP

on:
  # 1. Permite presionar un botón manual en GitHub Actions para desplegar
  workflow_dispatch:

  # 2. Se activa con push a master SOLO SI el commit lleva la palabra [deploy]
  push:
    branches:
      - master

jobs:
  compilar_y_subir:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código de GitHub (Con soporte de submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Preparar .NET Core 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Compilar el proyecto (Publish)
        run: |
          dotnet publish Login_Administracion_de_Modulos/Login_Administracion_de_Modulos.csproj -c Release -o ./publish_output

      - name: 3.1. Inyectar secretos de producción en publish_output
        env:
          PROD_DB_CONNECTION: ${{ secrets.DB_CONNECTION_STRING }}
          PROD_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          PROD_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python3 .github/scripts/inject-secrets.py ./publish_output

      # 4. Apagamos el sitio y esperamos 5 segundos para que Windows suelte la .dll
      - name: 4. Apagar sitio web temporalmente
        run: |
          echo "<html><head><meta charset='utf-8'></head><body><h2>Actualizando... vuelva en 1 minuto.</h2></body></html>" > app_offline.htm
          curl -k -T app_offline.htm -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm" || true
          sleep 5

      # 5. Subir los archivos nuevos al hosting
      - name: 5. Sincronizar archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./publish_output/
          server-dir: /wwwroot/

      # 6. Borramos app_offline.htm para que el servidor vuelva a encender con los cambios
      - name: 6. Encender el sitio web
        if: always()
        run: |
          curl -k -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" -Q "-DELE /wwwroot/app_offline.htm" || true
