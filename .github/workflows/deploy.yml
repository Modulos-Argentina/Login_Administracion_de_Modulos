name: Desplegar ASP.NET a MonsterASP

on:
  push:
    branches:
      - master # Cambiado para que escuche tu rama master

jobs:
  compilar_y_subir:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código de GitHub
        uses: actions/checkout@v4

      - name: 2. Preparar .NET Core 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Actualizado para usar .NET 10

      - name: 3. Compilar el proyecto (Publish)
        run: dotnet publish -c Release -o ./publish_output

      - name: 4. Sincronizar por FTP a MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./publish_output/
          server-dir: /wwwroot/
          danger-action: overwrite # Para que reemplace correctamente tus actualizaciones
